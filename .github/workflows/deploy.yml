name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: /api
          VITE_DEMO_PASSWORD: ${{ secrets.DEMO_ACCESS_PASSWORD }}

      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.12.225.253
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/invoice-router
            git pull origin main

            # Update Python dependencies
            source venv/bin/activate
            pip install -r backend/requirements.txt --quiet

            # Restart backend
            systemctl restart invoice-router
            sleep 3
            systemctl is-active invoice-router || (journalctl -u invoice-router --no-pager -n 20 && exit 1)

            echo "Backend deployed successfully"

      - name: Copy frontend build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 49.12.225.253
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/"
          target: "/var/www/invoice-router/frontend/"
          strip_components: 2

      - name: Reload nginx and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 49.12.225.253
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            nginx -t && systemctl reload nginx
            sleep 2
            curl -sf https://demo.inspirationtechcorp.com/api/health | grep -q '"status":"ok"'
            echo "Deployment verified — https://demo.inspirationtechcorp.com is live"
